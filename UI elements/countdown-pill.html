<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Countdown Pill - Arctos Bulkloader</title>
  <style>
    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --arctos-text: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      color: var(--arctos-text);
      background-color: #ffffff;
      padding: 32px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .countdown-pill {
      background: #f1f3f5;
      border-radius: 6px;
      padding: 8px 16px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #333333;
      line-height: 1.5;
    }

    .countdown-pill .pill-icon {
      width: 16px;
      height: 16px;
      opacity: 0.7;
      display: inline-block;
      flex-shrink: 0;
    }

    .countdown-pill strong {
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="countdown-pill">
    <img src="Icons/circle-question-solid resizes.svg" class="pill-icon" alt="Time">
    <span>Please finish using the staging table by <strong>2:04pm</strong></span>
  </div>

</body>
</html>
