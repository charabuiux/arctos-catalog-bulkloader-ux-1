<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Panel - Arctos Bulkloader</title>
  <style>
    :root {
      --arctos-navy: #00385f;
      --arctos-blue: #006699;
      --arctos-blue-btn: #0275d8;
      --arctos-grey-border: #d0d7de;
      --arctos-text: #212529;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --radius-sm: 4px;
      --radius-md: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      color: var(--arctos-text);
      background-color: #ffffff;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: stretch;
    }

    /* Multi-attribute Filter Box */
    .filter-boxes-area {
      display: flex;
      gap: 12px;
      width: 100%;
      max-width: 900px;
      background: #f8f9fa;
      border: 1px solid var(--arctos-grey-border);
      border-radius: var(--radius-md);
      padding: 12px;
    }

    .filter-column {
      display: flex;
      flex-direction: column;
      font-size: 13px;
      flex: 1;
      min-width: 90px;
    }

    .filter-col-title {
      font-weight: 600;
      color: #333;
      margin-bottom: 4px;
    }

    .filter-listbox {
      width: 100%;
      height: 96px;
      border: 1px solid #ced4da;
      background: #ffffff;
      font-size: 12px;
      padding: 2px;
      overflow-y: auto;
    }

    .filter-list-item {
      padding: 2px 6px;
      cursor: pointer;
      user-select: none;
    }

    .filter-list-item:hover {
      background-color: #e9ecef;
    }

    .filter-list-item.selected {
      background-color: var(--arctos-blue);
      color: #ffffff;
    }

    .filter-inputs-col {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      margin-left: auto;
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-row label {
      width: 50px;
      text-align: right;
      font-size: 12px;
      color: #333;
    }

    .filter-text-input {
      width: 180px;
      padding: 2px 6px;
      border: 1px solid #ced4da;
      border-radius: 3px;
      font-size: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.15s ease;
      border: 1px solid transparent;
      white-space: nowrap;
      font-family: inherit;
    }

    .btn-blue {
      background-color: var(--arctos-blue-btn);
      color: #ffffff;
      border-color: #0267bf;
    }

    .btn-blue:hover:not(:disabled) {
      background-color: #025aa5;
    }
  </style>
</head>
<body>

  <!-- Multi-attribute Filter Box -->
  <div class="filter-boxes-area">
    <!-- Entered By -->
    <div class="filter-column">
      <span class="filter-col-title">Entered By</span>
      <div class="filter-listbox" id="listbox-enteredby">
        <div class="filter-list-item selected" data-val="Any">Any</div>
        <div class="filter-list-item" data-val="jdoe">jdoe</div>
        <div class="filter-list-item" data-val="user2">user2</div>
        <div class="filter-list-item" data-val="testuser">testuser</div>
      </div>
    </div>

    <!-- Accession -->
    <div class="filter-column">
      <span class="filter-col-title">Accession</span>
      <div class="filter-listbox" id="listbox-accession">
        <div class="filter-list-item selected" data-val="Any">Any</div>
        <div class="filter-list-item" data-val="1004">1004</div>
        <div class="filter-list-item" data-val="1011">1011</div>
      </div>
    </div>

    <!-- Collection -->
    <div class="filter-column">
      <span class="filter-col-title">Collection</span>
      <div class="filter-listbox" id="listbox-collection">
        <div class="filter-list-item selected" data-val="Any">Any</div>
        <div class="filter-list-item" data-val="MVZ:Bird">MVZ:Bird</div>
        <div class="filter-list-item" data-val="MVZ:Fish">MVZ:Fish</div>
        <div class="filter-list-item" data-val="MVZ:Arch">MVZ:Arch</div>
      </div>
    </div>

    <!-- Text Inputs Column -->
    <div class="filter-inputs-col">
      <div class="input-row">
        <label>Key(s)</label>
        <input type="text" class="filter-text-input" id="inp-key">
      </div>
      <div class="input-row">
        <label>UUID</label>
        <input type="text" class="filter-text-input" id="inp-uuid">
      </div>
      <div class="input-row">
        <label>CatNum</label>
        <input type="text" class="filter-text-input" id="inp-catnum">
      </div>
      <div class="input-row">
        <label>Status</label>
        <input type="text" class="filter-text-input" id="inp-status">
      </div>
      <div style="text-align: right; margin-top: 4px;">
        <button class="btn btn-blue" id="btn-apply-filters" style="font-size: 11.5px; padding: 3px 10px;">
          Apply Filter
        </button>
      </div>
    </div>
  </div>

  <script>
    // Listbox selection logic
    document.querySelectorAll(".filter-listbox").forEach(listbox => {
      listbox.addEventListener("click", (e) => {
        const item = e.target.closest(".filter-list-item");
        if (!item) return;
        listbox.querySelectorAll(".filter-list-item").forEach(el => el.classList.remove("selected"));
        item.classList.add("selected");
      });
    });
  </script>

</body>
</html>
